[project]
name = "wagtail-mcp"
version = "0.2.0"
description = "Experimental MCP server for content operations from outside the CMS"
readme = "README.md"
license = "BSD-3-Clause"
classifiers = [
    # Update this based on your project's status.
    # See: https://pypi.org/classifiers/
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 8",
]
# See: https://devguide.python.org/versions/#supported-versions
requires-python = ">=3.10"
dependencies = [
    # https://www.djangoproject.com/download/#supported-versions
    "django>=5.2",
    # https://github.com/wagtail/wagtail/wiki/Release-schedule
    # https://docs.wagtail.org/en/latest/releases/upgrading.html#compatible-django-python-versions
    "wagtail>=8.0",
    # django-ninja arrives via Wagtail. Dispatch and the mcp pin: docs/contributing/architecture.md.
    "mcp==2.0.0",
]

[project.urls]
Homepage = "https://github.com/org-name-or-username/wagtail-mcp"
Repository = "https://github.com/org-name-or-username/wagtail-mcp"
Changelog = "https://github.com/org-name-or-username/wagtail-mcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/org-name-or-username/wagtail-mcp/tree/main/docs"
Issues = "https://github.com/org-name-or-username/wagtail-mcp/issues"

[project.optional-dependencies]
agent = [
    "django-ag-ui>=0.61.0",
    "pydantic-ai-slim[openai]>=2.45.0",
]
# Add funding link if needed.
# Funding = "https://github.com/org-name-or-username/wagtail-mcp"

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "dj-database-url>=3.1.2",
    "pytest>=8.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "ruff>=0.15.9",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wagtail_mcp"
source-exclude = [
    "wagtail_mcp/static_src",
    "wagtail_mcp/test",
    "wagtail_mcp/static/wagtail_mcp/js/.gitignore",
    "testmanage.py",
    ".*",
    "*.js",
    "*.json",
    "*.ini",
    "*.yml",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "wagtail_mcp.test.settings"
testpaths = ["tests", "src/wagtail_mcp/test/tests"]
anyio_mode = "auto"
